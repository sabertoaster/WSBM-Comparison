[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsbm-comparison"
version = "0.1.0"
description = "Reproducible WSBM reservoir, PPO, and InputDSA experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cmaes>=0.13.0",
    "gymnasium>=1.3.0",
    "igraph>=1.0.0",
    "imageio>=2.37.4",
    "joblib>=1.5.3",
    "keras>=3.12.4",
    "matplotlib>=3.10.9",
    "mujoco>=3.12.0",
    "netgraph>=4.13.2",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.2",
    "scipy>=1.15",
    "torch>=2.0",
    "dsa-metric",
    "optuna>=4.9.0",
    "reservoirpy",
    "scikit-learn>=1.7.2,<1.8",
    "seaborn>=0.13.2",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "tensorboard-data-server>=0.7.2",
    "tensorflow>=2.21.0",
    "tqdm>=4.70.0",
    "cebra>=0.4.0",
    "setuptools<81",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts", "er_mrl"]

[tool.uv.sources]
reservoirpy = { git = "https://github.com/sabertoaster/reservoirpy.git", rev = "wsbm-fix" }
dsa-metric = { path = "DSA", editable = true }

[project.scripts]
wsbm = "src.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: small numerical/environment integration checks"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["DSA"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
