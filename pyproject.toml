[project]
name = "wsbm-comparison"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cmaes>=0.13.0",
    "gymnasium>=1.3.0",
    "igraph>=1.0.0",
    "imageio>=2.37.4",
    "joblib>=1.5.3",
    "keras>=3.12.4",
    "matplotlib>=3.10.9",
    "mujoco>=3.12.0",
    "netgraph>=4.13.2",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "optuna>=4.9.0",
    "reservoirpy",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "tensorboard-data-server>=0.7.2",
    "tensorflow>=2.21.0",
    "tqdm>=4.70.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
reservoirpy = { git = "https://github.com/sabertoaster/reservoirpy.git", rev = "wsbm-fix" }
